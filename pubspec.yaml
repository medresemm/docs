name: cedvel
description: Cədvəl - Gününə nəzarət et | Nibras Code
publish_to: "none"
version: 1.3.0+4

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  percent_indicator: ^4.2.5
  uuid: ^4.5.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  gal: ^2.3.3
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
